; Limiti (nalaganje velikih datotek, uvoz baze, migracije)
upload_max_filesize = 1024M
post_max_size = 1024M
memory_limit = 512M
max_execution_time = 900
max_input_time = 900
max_input_vars = 10000

; Razvoj: prikaz napak
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; OPcache: takoj zazna spremembe datotek
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; e-pošta se v razvoju ne pošilja
sendmail_path = /bin/true
