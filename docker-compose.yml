name: multimedija

services:
  web:
    build:
      context: ./docker
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
        WWW_UID: ${WWW_UID:-1000}
        WWW_GID: ${WWW_GID:-1000}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=256M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-multimedija}
      MARIADB_USER: ${DB_USER:-wp}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wp}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  # Pregled baze v brskalniku (zaženeš po potrebi):
  #   docker compose --profile tools up -d adminer   ->  http://localhost:8081  (strežnik: db)
  adminer:
    image: adminer
    ports:
      - "${WEB_BIND:-127.0.0.1}:${ADMINER_PORT:-8081}:8080"
    profiles: ["tools"]
    depends_on:
      - db

volumes:
  db-data:
